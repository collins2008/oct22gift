<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Page Not Found — Open When...</title>
  <link rel="icon" type="image/png" href="Assets/favicon.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #fce4ec;
      background-image: url('Assets/gingham_clean.png');
      background-repeat: repeat;
      background-size: 110px 110px;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .flower {
      position: absolute;
      top: 0;
      right: 0;
      width: 120px;
      pointer-events: none;
    }
    .card {
      position: relative;
      background: #fffdf9;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      padding: 36px 24px;
      text-align: center;
      max-width: 340px;
      width: 100%;
    }
    h1 {
      color: #d4587a;
      font-size: 1.8rem;
      margin-bottom: 8px;
    }
    p {
      color: #3a1c2e;
      font-size: 1rem;
      line-height: 1.5;
      margin-bottom: 20px;
    }
    .char {
      width: 80px;
      height: auto;
      margin-bottom: 16px;
    }
    .btn {
      display: inline-block;
      background: #fdf6ee;
      border: 1.5px solid #c4956a;
      color: #8d5427;
      text-decoration: none;
      padding: 8px 24px;
      border-radius: 20px;
      font-size: 1.1rem;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
  </style>
</head>
<body>
  <img src="Assets/flower_top_right.webp" class="flower" alt="">
  <div class="card">
    <img src="Assets/char_cat_lying.webp" class="char" alt="Cute cat">
    <h1>Oops!</h1>
    <p>This note got lost in the mail... but don't worry, the letters are waiting for you!</p>
    <a href="index.html" class="btn">take me back 💕</a>
  </div>
</body>
</html>
